      - Joined after contributing anonymously for two months. First remote role,
        so I over-communicated on purpose and nobody had to guess what I was on.

  - name: Cypher Wallet (YC W22)
    position: Software Engineer Intern
    location: Chennai, India
    startDate: 2023-05
    endDate: 2023-12
    highlights:
      - Owned and shipped React Native features for the mobile app, and part of
