      - First Web3 role. Learned the space by working in it.

# One line each. These are side projects on a page that has to fit three jobs;
# a recruiter needs to know what each one is and what it is written in, and the
# link carries the rest. Kept in sync with src/data/projects, which the profile
# README at github.com/jassuwu/jassuwu governs.
projects:
  - name: andrew-dictate
    url: https://dictate.jass.gg
    startDate: 2026
    keywords: [Swift, macOS]
    description:
      On-device speech-to-text for macOS. Nothing leaves the machine, and it
      replaces a subscription.

  - name: mojify
    url: https://mojify.jass.gg
    startDate: 2026
    keywords: [Go, FFmpeg]
    description: Turns video into coloured ASCII and emoji. Wraps FFmpeg and yt-dlp.

  - name: quilt
    url: https://quilt.jass.gg
    startDate: 2026
    keywords: [TypeScript, Astro]
    description:
