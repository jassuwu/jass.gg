# The resume. This file is the source of truth; resume.typ is only how it looks.
#
# Field names follow JSON Resume (https://jsonresume.org/schema) so the content
# outlives the renderer. If Typst ever becomes a bad bet, this file is unchanged
# and only resume.typ gets rewritten.
#
# Dates are ISO `YYYY-MM`. An absent `endDate` means "Present". Do not write
# display strings like "Oct 2025 - Present" here. resume.typ formats them, which
# keeps the format consistent and the data machine-readable.
#
# Titles here are conventional ones, NOT the titles on LinkedIn. "savior of
# prod" is a good joke and an ATS match failure: title is one of the few fields
# every parser scores against the job req. The voice lives in the bullets.
#
# "Engineer" everywhere, never "Developer". Nium's is written out rather than
# left as "SDE II": no parser expands an acronym, so the acronym would make the
# current and most senior role score worst on the one field every ATS reads.
# "Development" is not "Developer" and the rule survives intact.
#
# The DeFi role is NOT titled "Independent Contributor", which was the first
# instinct and is wrong. It was a full-time role for those ten months. The
# independence describes how he got in the door, not what he was once through
# it, and putting it in the title slot makes a full-time job read as contract
# work to both a parser and a recruiter.
#
# "Software & Product Engineer" is what the ten months actually were: frontend
# and contract integrations, plus product discussions, a dashboard rewrite
# nobody asked for, and user research in Indonesia. "Product Engineer" is a real
# title that means exactly "engineer who also owns product calls", so it matches
# and it is true.
#
# The anonymous start is a better story than any title could carry, and the last
# bullet on that role tells it. Titles are for matching. Bullets are for stories.

basics:
  name: Karthickpranav S N
  label: Software Engineer
  email: jass@jass.gg
  url: https://www.jass.gg
  # Replaces the old skills grid. A list of every technology I have touched is
  # both unreadable and never complete; this says what I am and what I want next,
  # and the bullets below carry the keywords on their own.
  #
  # Three deliberate choices:
  #
  # "Engineer", not "frontend engineer". Most of the work has been frontend and
  # the bullets say so loudly enough. Naming it here narrows the roles this
  # document is allowed to win.
  #
  # "fintech", not "payments and Web3". The Web3 experience is real and stays in
  # the bullets, but leading with it sorts me into Web3-only pipelines, which is
  # not what I am looking for next.
  #
  # The last sentence is the one that has to survive edits. It is the actual
  # differentiator, the thing the Cypher bullets directly below then prove, and
  # it is the same belief the jass.gg homepage states in its own voice. Two
  # registers, one idea, deliberately not the same sentence.
  #
  # Its closing list names categories rather than one vivid example. An earlier
  # draft ended "the template every other repo copies", which reads better and
  # claims less: it describes a single thing I did instead of the kind of work I
  # want more of. The vivid version still exists, as evidence, in the DeFi
  # bullet. State the category here and let the bullets prove it.
  summary: >-
    Engineer, three years in, most of it in fintech. I do my best work when I
    can pick something up and own it end to end, given room to decide how. My
    favourite work ships nothing a user will ever see and makes every engineer
    around me faster: build and compile times, CI, shared templates, automation,
    internal tooling.
  location:
    region: India
  profiles:
    - network: GitHub
      username: jassuwu
      url: https://github.com/jassuwu
    - network: X
      username: jassdotgg
      url: https://x.com/jassdotgg
    - network: LinkedIn
      username: kprnv
      url: https://linkedin.com/in/kprnv

work:
