      embeddable SVG. No login.

  - name: better-splitwise
    url: https://bettersplitwise.jass.gg
    startDate: 2026
    keywords: [TypeScript, OCR]
    description: Scans a receipt, splits the bill by item, pushes the result to Splitwise.

